<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table of Mondrian</title>
    <link rel="stylesheet" href="file.css" />
  </head>

  <body>
    <table class="mondrian">
      <tr>
        <td rowspan="2" class="white"></td>
        <td rowspan="2" class="red"></td>
        <td class="yellow"></td>
        <td rowspan="3" class="white"></td>
      </tr>

      <tr>
        <td rowspan="2" class="white"></td>
      </tr>

      <tr>
        <td class="white"></td>
        <td rowspan="2" class="white"></td>
      </tr>

      <tr>
        <td class="black"></td>
        <td class="white"></td>
        <td class="blue"></td>
        <td class="yellow"></td>
      </tr>
    </table>
  </body>
</html>
